# yaml-language-server: $schema=../../schema/vocab-deck.schema.json
title: Verbs
# `meaning` is what Vocabulary shows. The four forms build Nani na Lini?
# sentences, so they use one meaning: kuita gives "We didn't call", not "call / call out".
# Stems and kept ku- forms are shown on each card automatically (from rules.yaml): don't
# repeat them in notes.
cards:
  # Core verbs, roughly most frequent first. "have" (kuwa na) is further down.
  - id: verb-kwenda
    kind: verb
    sw: kwenda
    en: { base: go, past: went, participle: gone, ing: going }
    note: 'Ninaenda is common too. Command: nenda!'

  - id: verb-kuja
    kind: verb
    sw: kuja
    en: { base: come, past: came, participle: come, ing: coming }
    note: 'Command: njoo!'

  - id: verb-kula
    kind: verb
    sw: kula
    en: { base: eat, past: ate, participle: eaten, ing: eating }

  - id: verb-kufanya
    kind: verb
    sw: kufanya
    en: { meaning: to do / to make, base: do, past: did, participle: done, ing: doing }

  - id: verb-kusema
    kind: verb
    sw: kusema
    en: { base: say, past: said, participle: said, ing: saying }

  - id: verb-kuona
    kind: verb
    sw: kuona
    en: { base: see, past: saw, participle: seen, ing: seeing, stative: true, third: sees }

  - id: verb-kupata
    kind: verb
    sw: kupata
    en:
      meaning: to get / to obtain
      base: get
      past: got
      participle: got
      ing: getting
      # Nimepata! is used exactly like "got it!"
      tenses: { perfect: { pos: '{have} got it', neg: "{have}n't got it yet" } }

  - id: verb-kupa
    kind: verb
    sw: kupa
    en: { base: give, past: gave, participle: given, ing: giving }
    note: 'Always needs a marker for who receives it: nipe, give me.'

  - id: verb-kupenda
    kind: verb
    sw: kupenda
    en: {
        meaning: to like / to love,
        base: like,
        past: liked,
        participle: liked,
        ing: liking,
        stative: true,
        third: likes,
        # Nimependa is a reaction ("I like it!"); sijapenda is rare, so rules.yaml skips it.
        tenses: { perfect: { pos: '{simple} it (now)', neg: "{do}n't like it yet" } },
      }

  - id: verb-kuelewa
    kind: verb
    sw: kuelewa
    en:
      base: understand
      past: understood
      participle: understood
      ing: understanding
      stative: true
      third: understands
      # Nimeelewa is the everyday "got it / I understand", like nimejua.
      tenses: { perfect: { pos: '{simple} now', neg: "{do}n't understand yet" } }
    example: { sw: Sielewi., en: I don't understand. }

  - id: verb-kuhitaji
    kind: verb
    sw: kuhitaji
    en: { base: need, past: needed, participle: needed, ing: needing, stative: true, third: needs }

  - id: verb-kutoka
    kind: verb
    sw: kutoka
    en:
      meaning: to go out / to come from / to leave
      base: go out
      past: went out
      participle: gone out
      ing: going out
      # Unatoka wapi? / Ninatoka… is "Where are you from?" / "I'm from…", so the present covers both.
      tenses:
        present:
          pos: '{be} going out / {subject} come{s} from'
          neg: "{be} not going out / {subject} {do}n't come from"

  - id: verb-kurudi
    kind: verb
    sw: kurudi
    en: { meaning: to return / to come back, base: return, past: returned, participle: returned, ing: returning }

  - id: verb-kufika
    kind: verb
    sw: kufika
    en: { base: arrive, past: arrived, participle: arrived, ing: arriving }

  - id: verb-kulala
    kind: verb
    sw: kulala
    en: { meaning: to sleep / to lie down, base: sleep, past: slept, participle: slept, ing: sleeping }

  # More everyday verbs. "meet" (kukutana) is further down.
  - id: verb-kusikia
    kind: verb
    sw: kusikia
    en: {
        meaning: to hear / to feel,
        base: hear,
        past: heard,
        participle: heard,
        ing: hearing,
        stative: true,
        third: hears,
        # Nimesikia is "noted / got it".
        tenses: { perfect: { pos: '{have} heard (got it)', neg: "{have}n't heard yet" } },
      }
    example: { sw: Nasikia njaa., en: I feel hungry. }
    note: 'Nasikia is everyday speech for ninasikia. Compare kusikiliza: to listen.'

  - id: verb-kuuliza
    kind: verb
    sw: kuuliza
    en: { base: ask, past: asked, participle: asked, ing: asking }

  - id: verb-kujibu
    kind: verb
    sw: kujibu
    en: { base: answer, past: answered, participle: answered, ing: answering }

  - id: verb-kufikiri
    kind: verb
    sw: kufikiri
    en:
      base: think
      past: thought
      participle: thought
      ing: thinking
      stative: true
      third: thinks
      tenses: { perfect: { pos: '{have} thought about it', neg: "{have}n't thought about it yet" } }

  - id: verb-kuongea
    kind: verb
    sw: kuongea
    hint: (everyday, especially in Kenya)
    en: { base: talk, past: talked, participle: talked, ing: talking }
    note: 'More everyday in Kenya than kuzungumza.'

  - id: verb-kununua
    kind: verb
    sw: kununua
    en: { base: buy, past: bought, participle: bought, ing: buying }

  - id: verb-kulipa
    kind: verb
    sw: kulipa
    en: { base: pay, past: paid, participle: paid, ing: paying }

  - id: verb-kuleta
    kind: verb
    sw: kuleta
    en: { base: bring, past: brought, participle: brought, ing: bringing }

  - id: verb-kuchukua
    kind: verb
    sw: kuchukua
    en: { base: take, past: took, participle: taken, ing: taking }

  - id: verb-kuweka
    kind: verb
    sw: kuweka
    en:
      meaning: to put / to place
      base: put (something)
      past: put (something)
      participle: put (something)
      ing: putting (something)

  - id: verb-kusaidia
    kind: verb
    sw: kusaidia
    en: { base: help, past: helped, participle: helped, ing: helping }

  - id: verb-kutafuta
    kind: verb
    sw: kutafuta
    # "Search" is complete English without an object; "I am looking for" isn't.
    en: { meaning: to look for / to search, base: search, past: searched, participle: searched, ing: searching }

  # wait: two verbs with the same meaning. Each accepts the other as an answer.
  - id: verb-kungoja
    kind: verb
    sw: kungoja
    alt: [kusubiri]
    en: { base: wait, past: waited, participle: waited, ing: waiting }

  - id: verb-kusubiri
    kind: verb
    sw: kusubiri
    alt: [kungoja]
    en: { base: wait, past: waited, participle: waited, ing: waiting }

  - id: verb-kupiga
    kind: verb
    sw: kupiga
    en: { meaning: to hit / to strike, base: hit, past: hit, participle: hit, ing: hitting }
    note: 'Used in lots of fixed phrases: piga simu, phone someone; piga picha, take a photo; piga kelele, shout.'

  # kuacha is stopping doing something, quitting, or leaving something behind. "I'm leaving"
  # would mean going away (kuondoka) and "I'm stopping" coming to a halt (kusimama), so its
  # sentences say "quit".
  - id: verb-kuacha
    kind: verb
    sw: kuacha
    en: { meaning: to quit / to stop doing / to leave behind, base: quit, past: quit, participle: quit, ing: quitting }
    note: 'Needs an object: ninaacha kazi, I''m quitting my job. Also "to let": mwache aende, let him/her go. To come to a halt (like a car) is kusimama, and "I''m leaving" (going away) is ninaondoka.'

  - id: verb-kutaka
    kind: verb
    sw: kutaka
    en: { base: want, past: wanted, participle: wanted, ing: wanting, stative: true, third: wants }

  - id: verb-kuitwa
    kind: verb
    sw: kuitwa
    en:
      meaning: to be called / to be named
      base: be called
      past: was called
      participle: been called
      ing: being called
      # Passive: "I am called" (ninaitwa), with was/were agreeing with the subject.
      tenses:
        present: { pos: '{be} called', neg: '{be} not called' }
        past: { pos: '{was} called', neg: "{was}n't called" }
        future: { pos: will be called, neg: "won't be called" }
        perfect: { pos: '{have} been called', neg: "{have}n't been called yet" }
    note: 'The passive of kuita (to call): anaitwa Chris, he is called Chris.'

  - id: verb-kuishi
    kind: verb
    sw: kuishi
    hint: (be alive, or reside)
    en:
      base: live
      past: lived
      participle: lived
      ing: living
      stative: true
      third: lives
      # Nimeishi needs a place or a time (nimeishi Nairobi miaka mitano); sijaishi is skipped.
      tenses: { perfect: { pos: '{have} lived (there)', neg: "{have}n't lived (there) yet" } }
    note: 'To live: be alive, or reside. Compare kukaa: to stay or sit, also to reside.'

  # kuita is to call someone over, or call someone by a name (the example), not to name someone,
  # so that sense is in the note. Shouting is usually kupiga kelele.
  - id: verb-kuita
    kind: verb
    sw: kuita
    en: { meaning: to call / to call out, base: call, past: called, participle: called, ing: calling }
    example: { sw: Wanamwita Chris., en: They call him Chris. }
    note: 'Also to call someone by a name, as in the example. Its passive is kuitwa (to be called). To shout is usually kupiga kelele.'

  - id: verb-kuweza
    kind: verb
    sw: kuweza
    en:
      meaning: can / to be able to
      base: be able
      past: was able
      participle: been able
      ing: being able
      # "can" has no -ing, no "to" and no past participle of its own.
      tenses:
        present: { pos: can, neg: "can't" }
        past: { pos: could, neg: "couldn't" }
        # Future keeps "to": kuweza is normally followed by another verb (nitaweza kuja).
        future: { pos: will be able to, neg: "won't be able to" }
        # Nimeweza is used like "I've managed".
        perfect: { pos: '{have} managed', neg: "{have}n't managed yet" }

  - id: verb-kuanza
    kind: verb
    sw: kuanza
    en: { base: begin, past: began, participle: begun, ing: beginning }

  - id: verb-kumaliza
    kind: verb
    sw: kumaliza
    en: { base: finish, past: finished, participle: finished, ing: finishing }

  - id: verb-kuogelea
    kind: verb
    sw: kuogelea
    en: { base: swim, past: swam, participle: swum, ing: swimming }

  - id: verb-kuoga
    kind: verb
    sw: kuoga
    en: { meaning: to bathe / to shower, base: bathe, past: bathed, participle: bathed, ing: bathing }

  - id: verb-kutunza
    kind: verb
    sw: kutunza
    en:
      meaning: to take care / to look after
      base: look after (something)
      past: looked after (something)
      participle: looked after (something)
      ing: looking after (something)

  - id: verb-kukaa
    kind: verb
    sw: kukaa
    en:
      meaning: to stay / to sit / to live
      base: stay
      past: stayed
      participle: stayed
      ing: staying
      # Nimekaa / sijakaa: "I've sat down" / "I haven't sat down yet" reads better than "stayed".
      tenses: { perfect: { pos: '{have} sat down', neg: "{have}n't sat down yet" } }
    example: { sw: Anakaa Nairobi., en: He lives in Nairobi. }
    note: 'To stay or sit; also to reside. Compare kuishi: to live, be alive or reside.'

  # Not in Nani na Lini? (see rules.yaml). Its `tenses` English is for fixtures.yaml.
  - id: verb-kuwa
    kind: verb
    sw: kuwa
    en:
      meaning: to be / to become
      base: be
      past: was
      participle: been
      ing: being
      tenses:
        present: { pos: '{be} becoming', neg: '{be} not becoming' }
        past: { pos: '{was}', neg: "{was}n't" }
        future: { pos: will be, neg: "won't be" }
        perfect: { pos: '{have} become', neg: "{have}n't become yet" }
    note: "In the present, am/is/are is ni, not kuwa: mimi ni mwalimu, I'm a teacher. Ninakuwa means I'm becoming."

  - id: vocab-kuwa-na
    kind: word
    sw: kuwa na
    en: to have
    note: "nina, I have · sina, I don't have · nilikuwa na, I had · nitakuwa na, I will have"

  - id: verb-kunywa
    kind: verb
    sw: kunywa
    en: { base: drink, past: drank, participle: drunk, ing: drinking }

  # kuonana is "see each other" (tuonane baadaye, see you later); "meet" is kukutana.
  - id: verb-kuonana
    kind: verb
    sw: kuonana
    en:
      meaning: to see each other
      base: see each other
      past: saw each other
      participle: seen each other
      ing: seeing each other
    example: { sw: Tuonane baadaye., en: See you later. }
    note: 'For "to meet", the everyday word is kukutana.'

  - id: verb-kukutana
    kind: verb
    sw: kukutana
    en: { base: meet, past: met, participle: met, ing: meeting }
    note: 'Compare kuonana: to see each other.'

  - id: verb-kuangalia
    kind: verb
    sw: kuangalia
    en: { meaning: to look / to look at / to be careful, base: look, past: looked, participle: looked, ing: looking }

  - id: verb-kuzungumza
    kind: verb
    sw: kuzungumza
    en: { meaning: to talk / to chat, base: talk, past: talked, participle: talked, ing: talking }
    note: 'Compare kuongea: also to talk, and more everyday in Kenya.'

  - id: verb-kujua
    kind: verb
    sw: kujua
    en:
      base: know
      past: knew
      participle: known
      ing: knowing
      stative: true
      third: knows
      # Sijajua is "I don't know yet", and nimejua "I know now" (I've found out), not "I have known".
      tenses:
        perfect: { pos: '{simple} now', neg: "{do}n't know yet" }

  - id: verb-kusikiliza
    kind: verb
    sw: kusikiliza
    en: { base: listen, past: listened, participle: listened, ing: listening }
    note: 'Compare kusikia: to hear, or to feel.'

  - id: verb-kuamka
    kind: verb
    sw: kuamka
    en: { base: wake up, past: woke up, participle: woken up, ing: waking up }
