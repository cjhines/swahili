# Known-correct forms. `npm run decks:check` (and CI) fails if rules.yaml produces anything else.
#
# Each table lists one verb in one tense, subjects in rules.yaml order:
#   I, you, he/she, we, you (plural), they, it (N-class), they (N-class)
# unless `subjects` picks a few.
#
# Written by Claude. `verified: true` ONLY when Chris's tutor or his grammar sheets confirm a table,
# and its note must say which ("Confirmed by Chris's tutor" / "Checked against Chris's grammar
# sheets"); CI enforces that. Word lists, however good, don't count.
# ✅ only records what's been confirmed; every tense is open in the app regardless.
# Readable version, with English and the part breakdown: forms.md (`npm run nani:forms`).
#
# 2026-11-12: a second review of forms.md found every conjugation correct, including the
# one-syllable irregulars (sili, sikula, sijala, sinywi, sikwenda, sijaenda, siji, hajaja) and the
# vowel and -i/-u endings (siiti, siishi, sihitaji, sijibu, siongei). By that reviewer's own
# standard it doesn't tick tables: ✅ still waits for the tutor or the grammar sheets.
# A follow-up the same day: kuacha's sentences say "quit", not "stop"; kunywa and kuja perfect
# get the same textbook-versus-Nairobi warning as kula; and each verb's tables sit together.
# Then a full review of all 204 tables in forms.md: not one wrong Swahili form, including vowel
# stems (siiti, siachi, huulizi), -i/-u stems (sisubiri, sijibu), sikukutana (the second ku is the
# stem's) and the one-syllable verbs and kwenda. Only English changed (the verb cards' `tenses`),
# plus `skip` in rules.yaml for perfects you'll rarely hear. Again, that doesn't tick tables.

# Things Claude wasn't sure of, printed at the top of forms.md. Remove each once it's answered.
# (The three from 2026-11-12 were answered by the full review the same day.)
questions: []

verbs:
  kusoma: { base: read, past: read, participle: read, ing: reading }
  kula: { base: eat, past: ate, participle: eaten, ing: eating }
  kunywa: { base: drink, past: drank, participle: drunk, ing: drinking }
  kwenda: { base: go, past: went, participle: gone, ing: going }
  kujibu: { base: answer, past: answered, participle: answered, ing: answering }
  kuosha: { base: wash, past: washed, participle: washed, ing: washing }
  kujua: { base: know, past: knew, participle: known, ing: knowing, stative: true, third: knows }
  kuishi: { base: live, past: lived, participle: lived, ing: living, stative: true, third: lives }
  kuita: { base: call, past: called, participle: called, ing: calling }
  kutaka: { base: want, past: wanted, participle: wanted, ing: wanting, stative: true, third: wants }
  kuweza:
    base: be able
    past: was able
    participle: been able
    ing: being able
    tenses:
      present: { pos: can, neg: "can't" }
      past: { pos: could, neg: "couldn't" }
      future: { pos: will be able to, neg: "won't be able to" }
      perfect: { pos: '{have} managed', neg: "{have}n't managed yet" }
  kuitwa:
    base: be called
    past: was called
    participle: been called
    ing: being called
    tenses:
      present: { pos: '{be} called', neg: '{be} not called' }
      past: { pos: '{was} called', neg: "{was}n't called" }
      future: { pos: will be called, neg: "won't be called" }
      perfect: { pos: '{have} been called', neg: "{have}n't been called yet" }
  # Chris's tutor: the present isn't "am/is/are" (that's ni: mimi ni mwalimu); ninakuwa means
  # "I'm becoming".
  kuwa:
    base: be
    past: was
    participle: been
    ing: being
    tenses:
      present: { pos: '{be} becoming', neg: '{be} not becoming' }
      past: { pos: '{was}', neg: "{was}n't" }
      future: { pos: will be, neg: "won't be" }
      perfect: { pos: '{have} become', neg: "{have}n't become yet" }
  kuja: { base: come, past: came, participle: come, ing: coming }
  kuona: { base: see, past: saw, participle: seen, ing: seeing, stative: true, third: sees }
  kupenda: { base: like, past: liked, participle: liked, ing: liking, stative: true, third: likes }
  kuelewa:
    {
      base: understand,
      past: understood,
      participle: understood,
      ing: understanding,
      stative: true,
      third: understands,
    }
  kuhitaji: { base: need, past: needed, participle: needed, ing: needing, stative: true, third: needs }
  kurudi: { base: return, past: returned, participle: returned, ing: returning }
  kufikiri: { base: think, past: thought, participle: thought, ing: thinking, stative: true, third: thinks }
  kuuliza: { base: ask, past: asked, participle: asked, ing: asking }
  kuacha: { base: quit, past: quit, participle: quit, ing: quitting }
  kuongea: { base: talk, past: talked, participle: talked, ing: talking }
  kusikia: { base: hear, past: heard, participle: heard, ing: hearing, stative: true, third: hears }
  kuweka: { base: put, past: put, participle: put, ing: putting }

paradigms:
  # Confirmed by Chris's tutor (2026-11-11): one-syllable verbs keep ku- in the na, li, ta and
  # me tenses. Only the forms the tutor gave, so these tables list positives only. The tutor's
  # nitakunywa is the kunywa future table below, next to the other kunywa tables.
  #
  # Each verb's tables sit together, in tense order, so forms.md reads verb by verb (a test
  # checks this).
  - verb: kuwa
    tense: present
    subjects: [i]
    pos: [ninakuwa]
    verified: true
    note: Confirmed by Chris's tutor. Ninakuwa means "I'm becoming"; "I am" is ni (mimi ni mwalimu).
  - verb: kuwa
    tense: past
    subjects: [i]
    pos: [nilikuwa]
    verified: true
    note: Confirmed by Chris's tutor.
  - verb: kuwa
    tense: future
    subjects: [i]
    pos: [nitakuwa]
    verified: true
    note: Confirmed by Chris's tutor.
  - verb: kuwa
    tense: perfect
    subjects: [i]
    pos: [nimekuwa]
    verified: true
    note: Confirmed by Chris's tutor.

  # A regular verb, in full.
  - verb: kusoma
    tense: present
    pos: [ninasoma, unasoma, anasoma, tunasoma, mnasoma, wanasoma, inasoma, zinasoma]
    neg: [sisomi, husomi, hasomi, hatusomi, hamsomi, hawasomi, haisomi, hazisomi]
    verified: false
  - verb: kusoma
    tense: past
    pos: [nilisoma, ulisoma, alisoma, tulisoma, mlisoma, walisoma, ilisoma, zilisoma]
    neg: [sikusoma, hukusoma, hakusoma, hatukusoma, hamkusoma, hawakusoma, haikusoma, hazikusoma]
    verified: false
  - verb: kusoma
    tense: future
    pos: [nitasoma, utasoma, atasoma, tutasoma, mtasoma, watasoma, itasoma, zitasoma]
    neg: [sitasoma, hutasoma, hatasoma, hatutasoma, hamtasoma, hawatasoma, haitasoma, hazitasoma]
    verified: false
  - verb: kusoma
    tense: perfect
    pos: [nimesoma, umesoma, amesoma, tumesoma, mmesoma, wamesoma, imesoma, zimesoma]
    neg: [sijasoma, hujasoma, hajasoma, hatujasoma, hamjasoma, hawajasoma, haijasoma, hazijasoma]
    verified: false

  # Have / don't have.
  - tense: have
    pos: [nina, una, ana, tuna, mna, wana, ina, zina]
    neg: [sina, huna, hana, hatuna, hamna, hawana, haina, hazina]
    verified: false

  # One syllable: keeps ku- in the positive tenses and the future negative, drops it elsewhere.
  - verb: kula
    tense: present
    pos: [ninakula, unakula, anakula, tunakula, mnakula, wanakula, inakula, zinakula]
    neg: [sili, huli, hali, hatuli, hamli, hawali, haili, hazili]
    verified: false
  - verb: kula
    tense: past
    pos: [nilikula, ulikula, alikula, tulikula, mlikula, walikula, ilikula, zilikula]
    neg: [sikula, hukula, hakula, hatukula, hamkula, hawakula, haikula, hazikula]
    verified: false
    note: The past-negative ku and kula's own ku are one and the same, so it's sikula, not sikukula.
  - verb: kula
    tense: future
    pos: [nitakula, utakula, atakula, tutakula, mtakula, watakula, itakula, zitakula]
    neg: [sitakula, hutakula, hatakula, hatutakula, hamtakula, hawatakula, haitakula, hazitakula]
    verified: false
  - verb: kula
    tense: perfect
    pos: [nimekula, umekula, amekula, tumekula, mmekula, wamekula, imekula, zimekula]
    neg: [sijala, hujala, hajala, hatujala, hamjala, hawajala, haijala, hazijala]
    verified: false
    note: Textbook forms. In Nairobi you'll often hear sijakula; check with your tutor before ticking.

  # Another one-syllable verb, to check the detection isn't fooled by "nyw".
  - verb: kunywa
    tense: present
    subjects: [i, heshe]
    pos: [ninakunywa, anakunywa]
    neg: [sinywi, hanywi]
    verified: false
    note: Chris's tutor confirmed ninakunywa; the rest still needs checking.
  - verb: kunywa
    tense: past
    subjects: [i, heshe]
    pos: [nilikunywa, alikunywa]
    neg: [sikunywa, hakunywa]
    verified: false
    note: Chris's tutor confirmed nilikunywa; the rest still needs checking.
  - verb: kunywa
    tense: future
    subjects: [i]
    pos: [nitakunywa]
    verified: true
    note: Confirmed by Chris's tutor.
  - verb: kunywa
    tense: perfect
    subjects: [i, heshe]
    pos: [nimekunywa, amekunywa]
    neg: [sijanywa, hajanywa]
    verified: false
    note: Textbook forms. In Nairobi you'll often hear sijakunywa and hajakunywa; check with your tutor before ticking.

  # kwenda behaves like a one-syllable verb, with kw- instead of ku-.
  - verb: kwenda
    tense: present
    subjects: [i, heshe]
    pos: [ninakwenda, anakwenda]
    neg: [siendi, haendi]
    verified: false
    note: Textbook forms (the core-verbs list also gives ninakwenda). Everyday speech also says ninaenda, nilienda, nimeenda.
  - verb: kwenda
    tense: past
    subjects: [i, heshe]
    note: Textbook forms. In Nairobi you'll often hear sikuenda; check with your tutor before ticking.
    pos: [nilikwenda, alikwenda]
    neg: [sikwenda, hakwenda]
    verified: false
  - verb: kwenda
    tense: future
    subjects: [i, heshe]
    pos: [nitakwenda, atakwenda]
    neg: [sitakwenda, hatakwenda]
    verified: false
  - verb: kwenda
    tense: perfect
    subjects: [i, heshe]
    pos: [nimekwenda, amekwenda]
    neg: [sijaenda, hajaenda]
    verified: false

  # Ends in -u (from Arabic): the present negative keeps it.
  - verb: kujibu
    tense: present
    subjects: [i, heshe, we]
    pos: [ninajibu, anajibu, tunajibu]
    neg: [sijibu, hajibu, hatujibu]
    verified: false

  # Starts with a vowel.
  - verb: kuosha
    tense: present
    subjects: [i, heshe]
    pos: [ninaosha, anaosha]
    neg: [sioshi, haoshi]
    verified: false
  - verb: kuosha
    tense: past
    subjects: [i, heshe]
    pos: [niliosha, aliosha]
    neg: [sikuosha, hakuosha]
    verified: false
  - verb: kuosha
    tense: perfect
    subjects: [i, heshe]
    pos: [nimeosha, ameosha]
    neg: [sijaosha, hajaosha]
    verified: false

  # From Chris's verbs deck: the famous sijui, a stem ending in -i, and a stem that's all vowels
  # around one consonant.
  - verb: kujua
    tense: present
    subjects: [i, heshe, we]
    pos: [ninajua, anajua, tunajua]
    neg: [sijui, hajui, hatujui]
    verified: false
  - verb: kuishi
    tense: present
    subjects: [i, heshe]
    pos: [ninaishi, anaishi]
    neg: [siishi, haishi]
    verified: false
    note: Ends in -i, so the present negative keeps it (siishi), like kujibu.
  - verb: kuita
    tense: present
    subjects: [i, heshe]
    pos: [ninaita, anaita]
    neg: [siiti, haiti]
    verified: false

  # Core verbs (2026-11-11): one-syllable kuja, a vowel stem (kuona), and stems ending in -i,
  # which keep it in the present negative (sihitaji, sirudi). The core-verbs list gave
  # nilikuja and sielewi; a word list isn't a checked reference, so those tables start unticked.
  - verb: kuja
    tense: present
    subjects: [i, heshe]
    pos: [ninakuja, anakuja]
    neg: [siji, haji]
    verified: false
  - verb: kuja
    tense: past
    subjects: [i, heshe]
    pos: [nilikuja, alikuja]
    neg: [sikuja, hakuja]
    verified: false
    note: The core-verbs list gives nilikuja.
  - verb: kuja
    tense: perfect
    subjects: [i, heshe]
    pos: [nimekuja, amekuja]
    neg: [sijaja, hajaja]
    verified: false
    note: Textbook forms. In Nairobi you'll often hear sijakuja and hajakuja; check with your tutor before ticking.
  - verb: kuelewa
    tense: present
    subjects: [i, heshe]
    pos: [ninaelewa, anaelewa]
    neg: [sielewi, haelewi]
    verified: false
    note: The core-verbs list gives sielewi, I don't understand.
  - verb: kuona
    tense: present
    subjects: [i, heshe]
    pos: [ninaona, anaona]
    neg: [sioni, haoni]
    verified: false
  - verb: kuhitaji
    tense: present
    subjects: [i, heshe]
    pos: [ninahitaji, anahitaji]
    neg: [sihitaji, hahitaji]
    verified: false
  - verb: kurudi
    tense: present
    subjects: [i, heshe]
    pos: [ninarudi, anarudi]
    neg: [sirudi, harudi]
    verified: false

  # More everyday verbs (2026-11-11): another stem ending in -i (sifikiri), and vowel stems.
  - verb: kufikiri
    tense: present
    subjects: [i, heshe]
    pos: [ninafikiri, anafikiri]
    neg: [sifikiri, hafikiri]
    verified: false
  - verb: kuuliza
    tense: present
    subjects: [i, heshe]
    pos: [ninauliza, anauliza]
    neg: [siulizi, haulizi]
    verified: false
  - verb: kuacha
    tense: present
    subjects: [i, heshe]
    pos: [ninaacha, anaacha]
    neg: [siachi, haachi]
    verified: false
  - verb: kuongea
    tense: present
    subjects: [i, heshe]
    pos: [ninaongea, anaongea]
    neg: [siongei, haongei]
    verified: false

english:
  - { verb: kusoma, subject: i, tense: present, polarity: pos, en: I am reading }
  - { verb: kusoma, subject: heshe, tense: present, polarity: neg, en: He/she is not reading }
  - { verb: kusoma, subject: we, tense: past, polarity: neg, en: We didn't read }
  - { verb: kusoma, subject: you, tense: future, polarity: pos, en: You will read }
  - { verb: kula, subject: youpl, tense: past, polarity: pos, en: You (plural) ate }
  - { verb: kula, subject: it, tense: future, polarity: neg, en: It (N-class) won't eat }
  - { verb: kula, subject: heshe, tense: perfect, polarity: pos, en: He/she has eaten }
  - { verb: kunywa, subject: they, tense: perfect, polarity: neg, en: They haven't drunk yet }
  - { verb: kwenda, subject: things, tense: perfect, polarity: neg, en: They (N-class) haven't gone yet }
  - { verb: kwenda, subject: things, tense: present, polarity: pos, en: They (N-class) are going }
  - { subject: i, tense: have, polarity: pos, en: I have }
  - { subject: heshe, tense: have, polarity: neg, en: He/she doesn't have }
  - { subject: it, tense: have, polarity: pos, en: It (N-class) has }
  - { subject: things, tense: have, polarity: neg, en: They (N-class) don't have }
  # Stative verbs: no -ing in the present, and he/she/it take the -s form.
  - { verb: kutaka, subject: heshe, tense: present, polarity: pos, en: He/she wants }
  - { verb: kutaka, subject: i, tense: present, polarity: neg, en: I don't want }
  - { verb: kujua, subject: it, tense: present, polarity: neg, en: It (N-class) doesn't know }
  - { verb: kutaka, subject: they, tense: past, polarity: pos, en: They wanted }
  # Verbs with their own English.
  - { verb: kuweza, subject: i, tense: present, polarity: neg, en: "I can't" }
  - { verb: kuweza, subject: we, tense: past, polarity: pos, en: We could }
  - { verb: kuweza, subject: heshe, tense: perfect, polarity: neg, en: "He/she hasn't managed yet" }
  - { verb: kuitwa, subject: we, tense: past, polarity: pos, en: We were called }
  - { verb: kuitwa, subject: heshe, tense: past, polarity: neg, en: "He/she wasn't called" }
  - { verb: kuitwa, subject: it, tense: present, polarity: pos, en: It (N-class) is called }
  # kuwa, as Chris's tutor explained it (it's excluded from Nani na Lini?, but its card shows these forms).
  - { verb: kuwa, subject: i, tense: present, polarity: pos, en: I am becoming }
  - { verb: kuwa, subject: i, tense: past, polarity: pos, en: I was }
  - { verb: kuwa, subject: they, tense: future, polarity: neg, en: "They won't be" }
  # Core verbs: stative ones take the simple present.
  - { verb: kuona, subject: heshe, tense: present, polarity: pos, en: He/she sees }
  - { verb: kupenda, subject: i, tense: present, polarity: neg, en: "I don't like" }
  - { verb: kuelewa, subject: i, tense: present, polarity: neg, en: "I don't understand" }
  - { verb: kuhitaji, subject: heshe, tense: present, polarity: pos, en: He/she needs }
  - { verb: kuja, subject: we, tense: past, polarity: pos, en: We came }
  # More everyday verbs: stative ones, and "put", whose past is spelled like its base.
  - { verb: kusikia, subject: heshe, tense: present, polarity: pos, en: He/she hears }
  - { verb: kufikiri, subject: i, tense: present, polarity: neg, en: "I don't think" }
  - { verb: kuweka, subject: we, tense: past, polarity: pos, en: We put }
  - { verb: kuweka, subject: we, tense: present, polarity: pos, en: We are putting }
  # kuacha: its sentences say "quit". "Stopping" sounds like coming to a halt (kusimama), and
  # "leaving" like going away (kuondoka).
  - { verb: kuacha, subject: i, tense: present, polarity: pos, en: I am quitting }
  - { verb: kuacha, subject: we, tense: past, polarity: neg, en: "We didn't quit" }
