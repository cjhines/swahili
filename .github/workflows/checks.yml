# Every check the app has to pass. Called by ci.yml (pull requests) and deploy.yml (main),
# so what gets deployed has passed exactly what a PR has to pass.
name: Checks

on:
  workflow_call:
    inputs:
      pages-artifact:
        description: Upload dist/ as the GitHub Pages artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the build under /swahili/
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Pages artifact
        if: inputs.pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
